name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: UniFree ${{ github.ref_name }}
          releaseBody: ""
          releaseDraft: false
          prerelease: false

  release-notes:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" -20)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..${{ github.ref_name }})
          fi
          echo "## UniFree ${{ github.ref_name }}" > changes.md
          echo "" >> changes.md
          echo "$CHANGES" >> changes.md
          echo "" >> changes.md
          echo "### Downloads" >> changes.md
          echo "- **UniFree_x64-setup.exe** - Windows (NSIS installer)" >> changes.md
          echo "- **UniFree_*_aarch64.dmg** - macOS (Apple Silicon / arm64 only, uploaded separately from an Apple Silicon machine)" >> changes.md
          echo "" >> changes.md
          echo "> macOS DMG is built natively on Apple Silicon and uploaded to the release manually:" >> changes.md
          echo "> \`cargo tauri build\` then upload \`UniFree_<version>_aarch64.dmg\`. GitHub-hosted arm64 runners are not available for this account." >> changes.md

      - name: Update release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: changes.md
